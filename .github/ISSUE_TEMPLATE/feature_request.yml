name: 功能建议
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前哪个能力缺失或不便?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或接口;如涉及核心设计变更,请说明理由
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 与项目定位的关系
      description: DBMS_C 为教学型原型,请说明建议是否符合「不改变核心设计、不新增大功能」的当前阶段目标
