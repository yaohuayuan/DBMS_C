name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test-windows:
    # 项目当前仅支持 Windows/MinGW(见 README 已知限制),Linux 移植在 Roadmap 中
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install MinGW-w64 and CMake
        run: choco install mingw cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        shell: pwsh

      - name: Configure
        run: cmake -G "MinGW Makefiles" -B build -S .
        shell: pwsh

      - name: Build
        run: cmake --build build -j4
        shell: pwsh

      - name: Run Tests
        run: ctest --test-dir build --output-on-failure
        shell: pwsh
